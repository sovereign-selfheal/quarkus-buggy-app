name: build

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Log in to quay.io
        run: |
          echo "${{ secrets.QUAY_PASSWORD }}" | podman login quay.io \
            -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Build and push with Jib
        run: |
          ./mvnw --no-transfer-progress package \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.tag="${GITHUB_REF_NAME}" \
            -DskipTests

      - name: Resolve pushed digest
        run: |
          skopeo inspect "docker://quay.io/sovereign-selfheal/quarkus-buggy-app:${GITHUB_REF_NAME}" \
            | tee /tmp/inspect.json
          echo "Digest: $(jq -r .Digest /tmp/inspect.json)"
          echo "Copy this digest into gitops components/quarkus-buggy-app/values.yaml"
