name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Quay builds and pushes this image on git tags (build trigger). This workflow only
# checks that the app and container image build; it pushes nothing.
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Maven build and tests
        run: ./mvnw --no-transfer-progress verify

      - name: Build container image with Jib (no push)
        run: |
          ./mvnw --no-transfer-progress package \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=false \
            -Dquarkus.container-image.tag=ci \
            -DskipTests
