# Application identity
quarkus.application.name=buggy-demo-app
quarkus.application.version=1.0.0

# HTTP
quarkus.http.port=8080

# Metrics — expose /q/metrics with Prometheus format
quarkus.micrometer.enabled=true
quarkus.micrometer.registry-enabled-default=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.http-server.match-patterns=/api/products,/api/orders,/api/inventory
quarkus.micrometer.distribution.percentile-histogram[http.server.requests]=true

# Health checks — expose /q/health, /q/health/live, /q/health/ready
quarkus.smallrye-health.root-path=/q/health

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.demo".level=DEBUG

# Container image (jib) — built by CI via:
#   ./mvnw package -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true \
#     -Dquarkus.container-image.tag=${GIT_TAG}
# The gitops repo (components/quarkus-buggy-app) pins the resulting digest; it never
# follows :latest. K8s manifests (Deployment, Service, Route, ServiceMonitor) live there,
# not in this repo.
quarkus.container-image.builder=jib
quarkus.container-image.registry=quay.io
quarkus.container-image.group=sovereign-selfheal
quarkus.container-image.name=quarkus-buggy-app
quarkus.container-image.tag=latest
quarkus.container-image.build=false
quarkus.container-image.push=false
